apps:
  - name: uptime-kuma
    description: A fancy self-hosted monitoring tool
    icon: https://raw.githubusercontent.com/louislam/uptime-kuma/master/public/icon.png
    version: 2.3.0
    category: Monitoring
    path: apps/uptime-kuma/app.yaml
    maintainer: Community
    tags: [monitoring, dashboard, uptime]
    source_url: https://github.com/louislam/uptime-kuma

  - name: code-server
    description: VS Code in the browser
    icon: https://raw.githubusercontent.com/coder/code-server/main/src/browser/media/pwa-icon-192.png
    version: 4.117.0
    category: Development
    path: apps/code-server/app.yaml
    maintainer: Coder
    tags: [ide, vscode, development]
    source_url: https://github.com/coder/code-server

  - name: vaultwarden
    description: Unofficial Bitwarden compatible server written in Rust
    icon: https://raw.githubusercontent.com/dani-garcia/vaultwarden/refs/heads/main/resources/vaultwarden-icon.svg
    version: 1.35.8
    category: Security
    path: apps/vaultwarden/app.yaml
    maintainer: Community
    tags: [password-manager, security, vault]
    source_url: https://github.com/dani-garcia/vaultwarden

  - name: immich
    description: High performance self-hosted photo and video management solution
    icon: https://raw.githubusercontent.com/immich-app/immich/main/docs/static/img/favicon.png
    version: v2
    category: Media
    path: apps/immich/app.yaml
    maintainer: Community
    tags: [photos, videos, backup, gallery]
    source_url: https://github.com/immich-app/immich

  - name: convertx
    description: Self-hosted online file converter supporting 1000+ formats
    icon: https://raw.githubusercontent.com/C4illin/ConvertX/main/public/android-chrome-192x192.png
    version: 0.17.0
    category: Utilities
    path: apps/convertx/app.yaml
    maintainer: Community
    tags: [converter, files, media, documents]
    source_url: https://github.com/C4illin/ConvertX

  - name: gitea
    description: A painless self-hosted Git service with code review, issues, and CI integrations
    icon: https://raw.githubusercontent.com/go-gitea/gitea/main/public/assets/img/logo.svg
    version: 1.26.1
    category: Development
    path: apps/gitea/app.yaml
    maintainer: Community
    tags: [git, scm, code, development]
    source_url: https://github.com/go-gitea/gitea

  # System services

  - name: namek
    description: Piccolo OS control plane — device auth, DNS, and token issuance
    version: latest
    category: System
    path: apps/namek/app.yaml
    maintainer: Piccolo
    tags: [system, dns, auth, control-plane]
    source_url: https://github.com/AtDexters-Lab/namek-server

  # Workspace environments

  - name: workspace-debian
    description: Debian MATE desktop in your browser — a full graphical workspace for general computing
    icon: https://www.debian.org/logos/openlogo-nd-100.png
    version: "bookworm"
    category: Workspace
    path: apps/workspace-debian/app.yaml
    maintainer: Piccolo
    tags: [workspace, debian, mate, desktop, gui]
    source_url: https://hub.docker.com/r/linuxserver/webtop

  - name: linux-vm
    description: A fresh Debian Linux server in your hand — like spinning up a cloud VM, but on your Piccolo
    icon: https://www.debian.org/logos/openlogo-nd-100.png
    version: "bookworm"
    category: Workspace
    path: apps/linux-vm/app.yaml
    maintainer: Piccolo
    tags: [workspace, debian, server, cli, vm, headless]
    source_url: https://hub.docker.com/_/microsoft-devcontainers-base