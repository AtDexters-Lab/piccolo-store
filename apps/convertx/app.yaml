inputs:
  jwt_secret:
    type: password
    label: "JWT Secret"
    description: "Secret key for signing JSON Web Tokens"
    generate: true
    required: true

  account_registration:
    type: boolean
    label: "Account Registration"
    description: "Allow new user registrations"
    default: false
    required: false

  allow_unauthenticated:
    type: boolean
    label: "Allow Unauthenticated"
    description: "Allow access without authentication"
    default: false
    required: false

services:
  main:
    image: ghcr.io/c4illin/convertx:v0.17.0
    bind_ports: [3000]
    environment:
      JWT_SECRET: "{{ .Inputs.jwt_secret }}"
      ACCOUNT_REGISTRATION: "{{ .Inputs.account_registration }}"
      ALLOW_UNAUTHENTICATED: "{{ .Inputs.allow_unauthenticated }}"
      HTTP_ALLOWED: "true"
    storage:
      persistent:
        data:
          container: /app/data
          size_limit: 10GB

listeners:
  - name: __primary
    guest_port: 3000
    flow: tcp
    protocol: http
    auth:
      rules:
        - path: "/"
          type: prefix
          strategy: protected

resources:
  priority: normal
  memory:
    min_required: 512MB
    profile: bounded

healthcheck:
  http:
    path: /favicon.ico
    timeout: 10s
    retries: 3

x-piccolo:
  mode: service
