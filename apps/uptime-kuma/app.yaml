services:
  main:
    image: docker.io/louislam/uptime-kuma:2.3.0
    bind_ports: [3001]
    storage:
      persistent:
        data:
          container: /app/data
          size_limit: 2GB

listeners:
  - name: __primary
    guest_port: 3001
    flow: tcp
    protocol: http
    auth:
      rules:
        # Public for external Prometheus scrapers; relies on uptime-kuma's
        # upstream basic-auth / API-key as the actual gate. If you disable
        # upstream auth on /metrics, monitor inventory becomes publicly
        # readable through the Piccolo listener.
        - path: "/metrics"
          type: exact
          strategy: public
        - path: "/"
          type: prefix
          strategy: protected

resources:
  priority: normal
  memory:
    min_required: 256MB
    profile: bounded

healthcheck:
  http:
    path: /
    timeout: 10s
    retries: 5

x-piccolo:
  mode: service
  replication:
    hot:
      datasets: [disk, data]
    cold:
      datasets: [disk, data]
      rpo: 1h
      consistency: crash_consistent
  secrets:
    injection: env
