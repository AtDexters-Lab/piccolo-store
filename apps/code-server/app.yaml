inputs:
  password:
    type: password
    label: "Access Password"
    description: "Password to log in to Code Server"
    generate: true
    required: true

services:
  main:
    image: docker.io/codercom/code-server:4.117.0
    bind_ports: [8080]
    environment:
      PASSWORD: "{{ .Inputs.password }}"
      SUDO_PASSWORD: "{{ .Inputs.password }}"
    storage:
      persistent:
        config:
          container: /home/coder/.config
          size_limit: 1GB
        project:
          container: /home/coder/project
          size_limit: 10GB

listeners:
  - name: __primary
    guest_port: 8080
    flow: tcp
    protocol: http
    auth:
      rules:
        - path: "/"
          type: prefix
          strategy: protected

resources:
  priority: normal
  memory:
    min_required: 512MB
    profile: bounded

healthcheck:
  http:
    path: /healthz
    timeout: 10s
    retries: 3

x-piccolo:
  mode: workspace
