type: system

inputs:
  __app_address__:
    type: string
    label: "App Address"
    description: "Subdomain for the Piccolo AI API (e.g. 'ai' -> ai.<domain>)"
    default: "ai"
    required: true
    validation:
      regex: "^[a-z][a-z0-9]{0,15}$"
      message: "Only lowercase letters and numbers; must start with a letter; max 16 chars."

  api_token:
    type: password
    label: "API Access Token — Save Before Installing"
    description: "Generated bearer token for the public /v3 API. Reveal and copy it before installing; Piccolo cannot show the current value afterward."
    generate: true
    required: true
    validation:
      regex: "^[A-Za-z0-9_-]{24,128}$"
      message: "Use 24-128 URL-safe letters, numbers, hyphens, or underscores."

  target_device:
    type: string
    label: "Inference Device"
    description: "OVMS inference target. GPU is recommended for Intel acceleration; CPU remains available as a compatibility fallback."
    default: "GPU"
    required: true
    validation:
      regex: "^(CPU|GPU)$"
      message: "Use CPU or GPU."

artifacts:
  model:
    source:
      type: huggingface
      repository: boris93/Qwen3-VL-4B-Instruct-int4-ov
      revision: d9bd0bcbadde6f1fd634e5e4734e0098e9a2a317
      path: .

primary_service: inference

services:
  inference:
    image: ghcr.io/atdexters-lab/piccolo-ai-ovms:0.1.3@sha256:35b5d9f2e04dc68a0ce22ed5d22f56b28f04f5907ae7e062b06f9d431db9a268
    bind_ports: [8000, 8001]
    environment:
      PICCOLO_AI_API_TOKEN: "{{ .Inputs.api_token }}"
      PICCOLO_AI_TARGET_DEVICE: "{{ .Inputs.target_device }}"
    storage:
      artifacts:
        model:
          container: /models/model

listeners:
  - name: __primary
    guest_port: 8000
    flow: tcp
    protocol: http
    remote_ports: [80, 443]
    auth:
      rules:
        - path: "/v3"
          type: exact
          strategy: public
        - path: "/v3/"
          type: prefix
          strategy: public
        - path: "/"
          type: prefix
          strategy: protected

  - name: inference
    guest_port: 8001
    flow: tcp
    protocol: http
    remote_ports: [80, 443]
    provides:
      - capability: ai.inference.openai.v1
        base_path: /v3
    auth:
      rules:
        - path: "/"
          type: prefix
          strategy: protected

resources:
  priority: normal
  memory:
    min_required: 12GB
    profile: elastic

healthcheck:
  http:
    path: /healthz
    timeout: 10s
    retries: 10

permissions:
  network:
    internet: allow
    local_network: deny
    dns: deny
  resources:
    max_processes: 512
    max_open_files: 65536
    privileged: false
  filesystem:
    read_only_root: true
    device_access: deny

x-piccolo:
  mode: service
  requires_features:
    - capability_bindings_v1
    - artifact_bindings_v1
  secrets:
    injection: env
